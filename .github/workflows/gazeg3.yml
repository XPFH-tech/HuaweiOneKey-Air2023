name: Air2023 Gaze G3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gazeg3/**', '.github/workflows/gazeg3.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Raabo/GazeUp
          ref: e8e7921198dc9fafe5b132fbe10c0ecc8796e481
          path: gazeup-upstream
          persist-credentials: false
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare pinned model
        run: |
          mkdir -p gazeg3/app/src/main/assets
          cp gazeup-upstream/app/src/main/assets/face_landmarker.task gazeg3/app/src/main/assets/
          test "$(stat -c%s gazeg3/app/src/main/assets/face_landmarker.task)" -gt 1000000
          cp gazeg3/NOTICE.md gazeg3/app/src/main/assets/
          cp gazeg3/licenses/*.txt gazeg3/app/src/main/assets/
          cp /usr/share/common-licenses/Apache-2.0 gazeg3/app/src/main/assets/MediaPipe-APACHE-2.0.txt
      - run: gradle -p gazeg3 --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and collect
        run: |
          mkdir -p output-gazeg3
          cp gazeg3/app/build/outputs/apk/debug/app-debug.apk output-gazeg3/Air2023-Gaze-G3.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose output-gazeg3/Air2023-Gaze-G3.apk
          "$BT/aapt2" dump badging output-gazeg3/Air2023-Gaze-G3.apk > output-gazeg3/manifest.txt
          grep -F "package: name='dev.air2023.gazeg3'" output-gazeg3/manifest.txt
          cp gazeg3/README.md gazeg3/NOTICE.md output-gazeg3/
          cp -r gazeg3/licenses output-gazeg3/
          git rev-parse HEAD > output-gazeg3/build-commit.txt
          (cd output-gazeg3 && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Air2023-Gaze-G3
          path: output-gazeg3/
          if-no-files-found: error
          retention-days: 7
